name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/ruff-action@v3
        with:
          args: "check src/ app/ tests/ scripts/ train.py attack.py"

  test:
    name: Test (CPU)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          version: "latest"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Create virtual environment
        run: uv venv

      - name: Install CPU PyTorch
        run: |
          uv pip install torch \
            --index-url https://download.pytorch.org/whl/cpu

      - name: Install project + dev dependencies
        run: uv sync --group dev --no-install-package torch

      - name: Install PyG CPU extensions
        run: |
          TORCH_VER=$(uv run python -c "import torch; print(torch.__version__.split('+')[0])")
          uv pip install torch_scatter torch_sparse torch_cluster \
            --find-links "https://data.pyg.org/whl/torch-${TORCH_VER}+cpu.html"

      - name: Run tests with coverage
        run: uv run pytest --tb=short -q --cov-report=xml

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage.xml
          retention-days: 30

  frontend:
    name: Frontend (type-check + build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npx vue-tsc --noEmit

      - name: Build
        run: npm run build
