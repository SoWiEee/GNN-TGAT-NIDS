defaults:
  - base
  - model: graphsage
  - data: static_default
  - _self_

train:
  lr: 0.001
  epochs: 200
  batch_size: 32
  save_every: 10        # save periodic checkpoint every N epochs
  val_every: 1          # run val evaluation every N epochs (increase to skip)
  num_workers: 0        # DataLoader workers (0 = main process; safe on Windows)
  use_amp: true         # automatic mixed precision (CUDA only)
  loss: focal           # "focal" | "cross_entropy"
  focal_gamma: 2.0      # focusing exponent (ignored when loss=cross_entropy)
  class_weight_strategy: inverse   # "inverse" | "effective" | "sqrt_inverse"
  val_metric: macro_f1              # "f1" (weighted) | "macro_f1" for checkpoint selection
  scheduler: cosine            # "none" | "cosine" | "plateau"
  oversample_factor: 5         # edge-level oversampling for rare classes (1 = disabled)
  checkpoint_dir: ${paths.checkpoints}/${hydra:runtime.choices.model}
  patience: 0                  # early stopping patience (0 = disabled)
  adversarial_training: false  # enable C-PGD augmented training
  adv_epsilon: 0.1             # adversarial perturbation budget
  adv_steps: 10                # PGD steps for adversarial example generation
  adv_ratio: 0.3               # fraction of batch replaced with adversarial examples
