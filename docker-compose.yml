services:
  backend:
    build: .
    ports:
      - "8000:8000"
    volumes:
      - ./checkpoints:/app/checkpoints
      - ./data/raw:/app/data/raw
      - ./data/processed:/app/data/processed
      - ./data/metrics:/app/data/metrics
      - ./data/sessions:/app/data/sessions
    environment:
      - ALLOWED_ORIGINS=http://localhost
      - ENABLE_ATTACK_ENDPOINTS=false
      - MAX_CONCURRENT_INFER=3
      - MAX_CONCURRENT_WS=5
      - SESSION_TTL_SECONDS=3600
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health')"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_BASE_URL: ""
    ports:
      - "80:80"
    depends_on:
      backend:
        condition: service_healthy
